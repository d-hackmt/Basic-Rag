name: deploy

# CI/CD: on every push to main, four gated jobs run in order -
#   1. test        - smoke-tests ask(agent, question) against the real agent
#   2. evaluate     - runs 5 of the 10 LangSmith correctness/groundedness examples (fast CI check)
#   3. build-and-push - builds the Docker image, pushes it to Amazon ECR
#   4. deploy       - SSHes into EC2 and restarts the container with the new image
# Each job only starts if the one before it succeeded (via `needs:`), so a
# broken agent or a crashing eval run stops the pipeline before anything gets
# built or deployed. Uses long-lived AWS access keys (stored as GitHub
# secrets) instead of OIDC, and a regular ubuntu-latest runner that SSHes out
# to the box - no self-hosted runner needed, no SSM. See
# docs/09_cicd_aws_ecr_ec2.md and docs/10_advanced_deployment.md for background.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: hr-assistant
  CONTAINER_NAME: hr-assistant
  APP_PORT: 8501

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Write .env from secret
        run: printf '%s' "${{ secrets.APP_ENV_FILE }}" > .env

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run smoke test (ask(agent, question))
        run: python -m pytest tests/ -v

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Write .env from secret
        run: printf '%s' "${{ secrets.APP_ENV_FILE }}" > .env

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run evaluation suite (5 examples, keeps CI fast)
        env:
          EVAL_LIMIT: "5"
        run: python evaluate.py

  build-and-push:
    needs: evaluate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV_FILE_CONTENT: ${{ secrets.APP_ENV_FILE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,ENV_FILE_CONTENT,CONTAINER_NAME,APP_PORT
          script: |
            set -euo pipefail

            # Install Docker on the box if it isn't there yet - makes a completely
            # fresh instance deployable with zero manual setup beyond SSH access.
            if ! command -v docker >/dev/null 2>&1; then
              echo "==> Installing Docker"
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            # Install the AWS CLI on the box if it isn't there yet (needed to log into ECR).
            if ! command -v aws >/dev/null 2>&1; then
              echo "==> Installing AWS CLI v2 (official installer - apt's awscli package isn't reliably available)"
              sudo apt-get update -y
              sudo apt-get install -y curl unzip
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
              unzip -q -o /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi

            echo "==> Writing runtime .env"
            printf '%s' "$ENV_FILE_CONTENT" > "$HOME/.env"
            chmod 600 "$HOME/.env"

            echo "==> Logging in to ECR"
            REGISTRY=$(echo "$IMAGE" | cut -d'/' -f1)
            aws ecr get-login-password --region "$AWS_REGION" \
              | sudo docker login --username AWS --password-stdin "$REGISTRY"

            echo "==> Pulling new image: $IMAGE"
            sudo docker pull "$IMAGE"

            echo "==> Restarting container"
            sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true
            sudo docker rm "$CONTAINER_NAME" 2>/dev/null || true
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${APP_PORT}:${APP_PORT}" \
              --env-file "$HOME/.env" \
              "$IMAGE"

            echo "==> Cleaning up old images"
            sudo docker image prune -f

            echo "==> Health check"
            for i in $(seq 1 20); do
              if curl -fsS "http://localhost:${APP_PORT}/_stcore/health" >/dev/null 2>&1; then
                echo "Deployed OK: $IMAGE"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after 60s"
            exit 1
